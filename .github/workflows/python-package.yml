# Lint and test the Python package on GitHub. Building and publishing to
# Google Artifact Registry is handled by python-package/.gitlab-ci.yml.
name: python-package

on:
  push:
    branches: [main]
    paths: ["python-package/**", ".github/workflows/python-package.yml"]
  pull_request:
    paths: ["python-package/**", ".github/workflows/python-package.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: python-package

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pylint pytest .
      - run: pylint src/ tests/

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest pytest-cov .
      - run: pytest --cov=tempconv --cov-report=term --cov-report=xml:coverage.xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: python-package/coverage.xml
